<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="602" viewBox="0 0 960 602" role="img" aria-labelledby="title desc">
  <title id="title">vln · 逐元素自然对数</title>
  <desc id="desc">数学示意：输入为 1、e、e 的平方、e 的立方，第三个位置 mask 为 false。ZEROING 将该位置置零，MERGING 保留源值 e 的平方；其他位置得到约 0、1、3。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8292A4"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #183047; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #536478; }
    .label { font-size: 19px; font-weight: 600; }
    .small { font-size: 17px; fill: #536478; }
    .index { font-size: 15px; fill: #697889; }
    .cell { font-size: 21px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="601" rx="12" fill="#FFFFFF" stroke="#D5DFE9"/>
  <text x="32" y="49" class="title">vln · 逐元素自然对数</text>
  <text x="928" y="46" class="small" text-anchor="end">TLA / SIMD</text>
  <text x="32" y="81" class="subtitle">活跃位置计算 ln(src)，其余位置按 mode 处理。</text>
  <line x1="32" y1="103" x2="928" y2="103" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="383.0" y="139" class="small" text-anchor="middle">位置 0</text>
  <text x="523.0" y="139" class="small" text-anchor="middle">位置 1</text>
  <text x="663.0" y="139" class="small" text-anchor="middle">位置 2</text>
  <text x="803.0" y="139" class="small" text-anchor="middle">位置 3</text>
  <text x="56" y="191" class="label">src</text>
  <rect x="320" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="383.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">1</text>
  <rect x="460" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="523.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">e</text>
  <rect x="600" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="663.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">e²</text>
  <rect x="740" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="803.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">e³</text>
  <text x="56" y="265" class="label">mask</text>
  <rect x="320" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="383.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <rect x="460" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="523.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <rect x="600" y="232" width="126" height="50" rx="6" fill="#F1F3F5" stroke="#C5CED7"/>
  <text x="663.0" y="264.0" class="cell" text-anchor="middle" style="fill:#697889">false</text>
  <rect x="740" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="803.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <text x="56" y="390" class="label">ZEROING</text>
  <rect x="320" y="357" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="383.0" y="389.0" class="cell" text-anchor="middle" style="fill:#146350">0</text>
  <rect x="460" y="357" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="523.0" y="389.0" class="cell" text-anchor="middle" style="fill:#146350">≈ 1</text>
  <rect x="600" y="357" width="126" height="50" rx="6" fill="#F1F3F5" stroke="#C5CED7"/>
  <text x="663.0" y="389.0" class="cell" text-anchor="middle" style="fill:#697889">0</text>
  <rect x="740" y="357" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="803.0" y="389.0" class="cell" text-anchor="middle" style="fill:#146350">≈ 3</text>
  <text x="56" y="466" class="label">MERGING</text>
  <rect x="320" y="433" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="383.0" y="465.0" class="cell" text-anchor="middle" style="fill:#146350">0</text>
  <rect x="460" y="433" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="523.0" y="465.0" class="cell" text-anchor="middle" style="fill:#146350">≈ 1</text>
  <rect x="600" y="433" width="126" height="50" rx="6" fill="#FFF2D9" stroke="#BB8428"/>
  <text x="663.0" y="465.0" class="cell" text-anchor="middle" style="fill:#795319">e²</text>
  <rect x="740" y="433" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="803.0" y="465.0" class="cell" text-anchor="middle" style="fill:#146350">≈ 3</text>
  <line x1="56" y1="316" x2="904" y2="316" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="56" y="339" class="small">mask = false 的位置</text>
  <line x1="32" y1="509" x2="928" y2="509" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="32" y="534" class="small">位置 2：ZEROING 填 0；MERGING 保留 src[2]。</text>
  <text x="32" y="559" class="small">e 为自然常数；图中只作数学示意，实际结果受浮点表示和指令精度影响。</text>
</svg>
