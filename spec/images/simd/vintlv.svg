  <text x="391" y="86" text-anchor="middle" class="value">4</text>
    <rect x="418" y="46" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="445" y="86" text-anchor="middle" class="value">5</text>
    <rect x="472" y="46" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="499" y="86" text-anchor="middle" class="value">6</text>
    <rect x="526" y="46" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="553" y="86" text-anchor="middle" class="value">7</text>
