<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="507" viewBox="0 0 1000 507" role="img" aria-labelledby="title desc">
  <title id="title">vln：自然对数与掩码结果模式</title>
  <desc id="desc">数学示意：输入 1、e、e 的平方、e 的立方，mask 为 1、1、0、1。ZEROING 得到约 0、1、0、3，MERGING 得到约 0、1、e 的平方、3。禁用位置保留源值或填零，其他位置计算自然对数。实际结果有浮点误差。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #191919; font-size: 26px; }
    .value { fill: #FFFFFF; }
    .note { font-size: 20px; }
    .index { font-size: 18px; }
    .caption { font-size: 25px; }
  </style>
  <rect width="1000" height="507" fill="#FFFFFF"/>
  <g id="src">
    <rect x="360" y="40" width="110" height="58" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="78" text-anchor="middle" class="value">1</text>
    <rect x="470" y="40" width="110" height="58" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="78" text-anchor="middle" class="value">e</text>
    <rect x="580" y="40" width="110" height="58" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="78" text-anchor="middle" class="value">e²</text>
    <rect x="690" y="40" width="110" height="58" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="78" text-anchor="middle" class="value">e³</text>
  </g>
  <text x="336" y="78" text-anchor="end">src</text>
  <g id="mask">
    <rect x="360" y="125" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="156" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="470" y="125" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="156" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="580" y="125" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="156" text-anchor="middle" class="value" style="fill:#191919">0</text>
    <rect x="690" y="125" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="156" text-anchor="middle" class="value" style="fill:#191919">1</text>
  </g>
  <text x="336" y="156" text-anchor="end">mask</text>
  <polygon points="571,191 589,191 589,213 597.5,213 580,241 562.5,213 571,213" fill="#582877" stroke="#191919" stroke-width="2.4"/>
  <text x="614" y="223" text-anchor="start" class="note">ln</text>
  <g id="zeroing">
    <rect x="360" y="265" width="110" height="58" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="303" text-anchor="middle" class="value">0</text>
    <rect x="470" y="265" width="110" height="58" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="303" text-anchor="middle" class="value">≈ 1</text>
    <rect x="580" y="265" width="110" height="58" fill="#EEEEEE" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="303" text-anchor="middle" class="value" style="fill:#191919">0</text>
    <rect x="690" y="265" width="110" height="58" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="303" text-anchor="middle" class="value">≈ 3</text>
  </g>
  <text x="336" y="303" text-anchor="end">ZEROING</text>
  <g id="merging">
    <rect x="360" y="348" width="110" height="58" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="386" text-anchor="middle" class="value">0</text>
    <rect x="470" y="348" width="110" height="58" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="386" text-anchor="middle" class="value">≈ 1</text>
    <rect x="580" y="348" width="110" height="58" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="386" text-anchor="middle" class="value">e²</text>
    <rect x="690" y="348" width="110" height="58" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="386" text-anchor="middle" class="value">≈ 3</text>
  </g>
  <text x="336" y="386" text-anchor="end">MERGING</text>
  <text x="500" y="451" text-anchor="middle" class="caption">vln：逐元素计算 ln(src)</text>
  <text x="500" y="484" text-anchor="middle" class="note">mask = 0：ZEROING 填 0，MERGING 保留 src；e 为自然常数，数值仅作示意。</text>
</svg>
