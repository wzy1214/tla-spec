<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">vintlv：交错示意</title>
  <desc id="desc">src1 为绿色，src2 为蓝色。输入逐元素交错后分成两个等长结果，dst0 取前半部分，dst1 取后半部分。格内数字表示源元素下标，不是元素值。每个输入用八个元素说明排列，实际长度见接口参数表。</desc>
