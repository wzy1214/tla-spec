    <rect x="1058" y="195" width="50" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="1083" y="225" text-anchor="middle" class="value" style="fill:#191919">0</text>
    <rect x="1108" y="195" width="50" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="1133" y="225" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="1158" y="195" width="50" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="1183" y="225" text-anchor="middle" class="value" style="fill:#191919">1</text>
