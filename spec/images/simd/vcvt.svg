  <title id="title">vcvt · 转换与位置选择</title>
  <desc id="desc">缩窄转换将源元素写到结果的偶数或奇数位置，扩宽转换从源的偶数或奇数位置取数。未写入位置在 ZEROING 下填零，在 MERGING 下保留 merge 对应位置。</desc>
