  <text x="393" y="438" text-anchor="middle" class="index">4</text>
    <rect x="418" y="449" width="50" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="443" y="488" text-anchor="middle" class="value">c′</text>
  <text x="443" y="438" text-anchor="middle" class="index">5</text>
    <rect x="468" y="449" width="50" height="60" fill="#EEEEEE" stroke="#191919" stroke-width="2.4"/>
  <text x="493" y="488" text-anchor="middle" class="value" style="fill:#191919">—</text>
  <text x="493" y="438" text-anchor="middle" class="index">6</text>
    <rect x="518" y="449" width="50" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="543" y="488" text-anchor="middle" class="value">d′</text>
  <text x="543" y="438" text-anchor="middle" class="index">7</text>
  </g>
  <text x="144" y="488" text-anchor="end">ODD</text>
  <text x="1008" y="38" text-anchor="middle">float16 → float32</text>
  <g id="widen-src">
    <rect x="808" y="100" width="50" height="60" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="833" y="139" text-anchor="middle" class="value">a</text>
  <text x="833" y="89" text-anchor="middle" class="index">0</text>
