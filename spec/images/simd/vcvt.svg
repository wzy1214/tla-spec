  <text x="443" y="339" text-anchor="middle" class="index">5</text>
    <rect x="468" y="350" width="50" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="493" y="389" text-anchor="middle" class="value">d′</text>
