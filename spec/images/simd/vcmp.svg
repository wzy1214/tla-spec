<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-labelledby="title desc">
  <title id="title">vcmp：逐元素比较与 mask</title>
  <desc id="desc">CMP.LT 比较前四个位置：src0 为 1、5、3、8，src1 为 2、4、3、9。mask 为 1、1、1、0，结果为 1、0、0、0；1 表示 true，0 表示 false。最后一个比较虽成立，但被 mask 禁用。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #191919; font-size: 26px; }
    .value { fill: #FFFFFF; }
    .note { font-size: 20px; }
    .index { font-size: 18px; }
    .caption { font-size: 25px; }
  </style>
  <rect width="1000" height="485" fill="#FFFFFF"/>
  <g id="src0">
    <rect x="360" y="35" width="110" height="55" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="71.5" text-anchor="middle" class="value">1</text>
  <text x="415" y="24" text-anchor="middle" class="index">0</text>
    <rect x="470" y="35" width="110" height="55" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="71.5" text-anchor="middle" class="value">5</text>
  <text x="525" y="24" text-anchor="middle" class="index">1</text>
    <rect x="580" y="35" width="110" height="55" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="71.5" text-anchor="middle" class="value">3</text>
  <text x="635" y="24" text-anchor="middle" class="index">2</text>
    <rect x="690" y="35" width="110" height="55" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="71.5" text-anchor="middle" class="value">8</text>
  <text x="745" y="24" text-anchor="middle" class="index">3</text>
  </g>
  <text x="336" y="71.5" text-anchor="end">src0</text>
  <g id="src1">
    <rect x="360" y="113" width="110" height="55" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="149.5" text-anchor="middle" class="value">2</text>
    <rect x="470" y="113" width="110" height="55" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="149.5" text-anchor="middle" class="value">4</text>
    <rect x="580" y="113" width="110" height="55" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="149.5" text-anchor="middle" class="value">3</text>
    <rect x="690" y="113" width="110" height="55" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="149.5" text-anchor="middle" class="value">9</text>
  </g>
  <text x="336" y="149.5" text-anchor="end">src1</text>
  <g id="mask">
    <rect x="360" y="191" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="222" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="470" y="191" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="222" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="580" y="191" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="222" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="690" y="191" width="110" height="44" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="222" text-anchor="middle" class="value" style="fill:#191919">0</text>
  </g>
  <text x="336" y="222" text-anchor="end">mask</text>
  <polygon points="571,256 589,256 589,278 597.5,278 580,306 562.5,278 571,278" fill="#582877" stroke="#191919" stroke-width="2.4"/>
  <text x="614" y="288" text-anchor="start" class="note">CMP.LT</text>
  <g id="dst">
    <rect x="360" y="329" width="110" height="55" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="415" y="365.5" text-anchor="middle" class="value">1</text>
    <rect x="470" y="329" width="110" height="55" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="525" y="365.5" text-anchor="middle" class="value" style="fill:#191919">0</text>
    <rect x="580" y="329" width="110" height="55" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="635" y="365.5" text-anchor="middle" class="value" style="fill:#191919">0</text>
    <rect x="690" y="329" width="110" height="55" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="745" y="365.5" text-anchor="middle" class="value" style="fill:#191919">0</text>
  </g>
  <text x="336" y="365.5" text-anchor="end">dst</text>
  <text x="500" y="430" text-anchor="middle" class="caption">vcmp：逐位置比较（展示前 4 个元素）</text>
  <text x="500" y="463" text-anchor="middle" class="note">mask 为 0 的位置输出 0；1 = true，0 = false。</text>
</svg>
