<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">vcmp · 逐元素比较</title>
  <desc id="desc">前四个源元素分别为 1、5、3、8 和 2、4、3、9，mask 为 true、true、true、false，结果为 true、false、false、false。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8292A4"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #183047; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #536478; }
    .label { font-size: 19px; font-weight: 600; }
    .small { font-size: 17px; fill: #536478; }
    .index { font-size: 15px; fill: #697889; }
    .cell { font-size: 21px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="589" rx="12" fill="#FFFFFF" stroke="#D5DFE9"/>
  <text x="32" y="49" class="title">vcmp · 逐元素比较</text>
  <text x="928" y="46" class="small" text-anchor="end">TLA / SIMD</text>
  <text x="32" y="81" class="subtitle">以 CMP.LT 为例：只有 mask 为 true 的位置参与比较。</text>
  <line x1="32" y1="103" x2="928" y2="103" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="383.0" y="139" class="small" text-anchor="middle">位置 0</text>
  <text x="523.0" y="139" class="small" text-anchor="middle">位置 1</text>
  <text x="663.0" y="139" class="small" text-anchor="middle">位置 2</text>
  <text x="803.0" y="139" class="small" text-anchor="middle">位置 3</text>
  <text x="56" y="191" class="label">src0</text>
  <rect x="320" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="383.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">1</text>
  <rect x="460" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="523.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">5</text>
  <rect x="600" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="663.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">3</text>
  <rect x="740" y="158" width="126" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="803.0" y="190.0" class="cell" text-anchor="middle" style="fill:#214E94">8</text>
  <text x="56" y="265" class="label">src1</text>
  <rect x="320" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="383.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">2</text>
  <rect x="460" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="523.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">4</text>
  <rect x="600" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="663.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">3</text>
  <rect x="740" y="232" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="803.0" y="264.0" class="cell" text-anchor="middle" style="fill:#146350">9</text>
  <text x="56" y="339" class="label">mask</text>
  <rect x="320" y="306" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="383.0" y="338.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <rect x="460" y="306" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="523.0" y="338.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <rect x="600" y="306" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="663.0" y="338.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <rect x="740" y="306" width="126" height="50" rx="6" fill="#F1F3F5" stroke="#C5CED7"/>
  <text x="803.0" y="338.0" class="cell" text-anchor="middle" style="fill:#697889">false</text>
  <text x="56" y="463" class="label">结果</text>
  <rect x="320" y="430" width="126" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="383.0" y="462.0" class="cell" text-anchor="middle" style="fill:#146350">true</text>
  <rect x="460" y="430" width="126" height="50" rx="6" fill="#F1F3F5" stroke="#C5CED7"/>
  <text x="523.0" y="462.0" class="cell" text-anchor="middle" style="fill:#697889">false</text>
  <rect x="600" y="430" width="126" height="50" rx="6" fill="#F1F3F5" stroke="#C5CED7"/>
  <text x="663.0" y="462.0" class="cell" text-anchor="middle" style="fill:#697889">false</text>
  <rect x="740" y="430" width="126" height="50" rx="6" fill="#F1F3F5" stroke="#C5CED7"/>
  <text x="803.0" y="462.0" class="cell" text-anchor="middle" style="fill:#697889">false</text>
  <line x1="56" y1="387" x2="904" y2="387" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="56" y="410" class="small">src0 &lt; src1，再应用 mask</text>
  <line x1="32" y1="497" x2="928" y2="497" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="32" y="522" class="small">位置 3：8 &lt; 9 为 true，但 mask 为 false，因此结果仍为 false。</text>
  <text x="32" y="547" class="small">仅展示向量的前 4 个位置；其余位置使用相同规则。</text>
</svg>
