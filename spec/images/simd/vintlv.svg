    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #191919; font-size: 26px; }
    .value { fill: #FFFFFF; }
    .note { font-size: 20px; }
    .index { font-size: 18px; }
    .caption { font-size: 25px; }
  </style>
  <rect width="1280" height="480" fill="#FFFFFF"/>
  <g id="src-0">
