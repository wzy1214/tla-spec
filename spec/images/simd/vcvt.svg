  <polygon points="999,262 1017,262 1017,286 1025.5,286 1008,314 990.5,286 999,286" fill="#582877" stroke="#191919" stroke-width="2.4"/>
  <g id="widen-even">
    <rect x="808" y="350" width="100" height="60" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="858" y="389" text-anchor="middle" class="value">a′</text>
  <text x="858" y="339" text-anchor="middle" class="index">0</text>
