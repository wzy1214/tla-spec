  <text x="640" y="558" text-anchor="middle" class="caption">vcvt：位置选择与源 mask（仅展示向量开头）</text>
  <text x="640" y="591" text-anchor="middle" class="note">a′ 为转换后的 a；mask 中 1 = true，0 = false。</text>
