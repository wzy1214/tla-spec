<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">vcvt：类型转换、奇偶位置与 mask</title>
  <desc id="desc">左图 float32 转 float16：源 a、b、c、d，mask 为 1、0、1、1；转换后的 a、c、d 写入选定奇偶位置。右图 float16 转 float32：源 a 至 h，mask 为 1、1、0、1、1、0、1、1；EVEN 读取 a、c、e、g，ODD 读取 b、d、f、h，禁用源对应的结果不写入。灰格在 ZEROING 下填零，在 MERGING 下保留 merge 对应位置。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #191919; font-size: 26px; }
    .value { fill: #FFFFFF; }
    .note { font-size: 20px; }
    .index { font-size: 18px; }
    .caption { font-size: 25px; }
  </style>
  <rect width="1280" height="640" fill="#FFFFFF"/>
  <text x="368" y="38" text-anchor="middle">float32 → float16</text>
  <g id="narrow-src">
    <rect x="168" y="100" width="100" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="218" y="139" text-anchor="middle" class="value">a</text>
  <text x="218" y="89" text-anchor="middle" class="index">0</text>
    <rect x="268" y="100" width="100" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="318" y="139" text-anchor="middle" class="value">b</text>
  <text x="318" y="89" text-anchor="middle" class="index">1</text>
    <rect x="368" y="100" width="100" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="418" y="139" text-anchor="middle" class="value">c</text>
  <text x="418" y="89" text-anchor="middle" class="index">2</text>
    <rect x="468" y="100" width="100" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="518" y="139" text-anchor="middle" class="value">d</text>
  <text x="518" y="89" text-anchor="middle" class="index">3</text>
  </g>
  <text x="144" y="139" text-anchor="end">src</text>
  <g id="narrow-mask">
    <rect x="168" y="195" width="100" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="218" y="225" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="268" y="195" width="100" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="318" y="225" text-anchor="middle" class="value" style="fill:#191919">0</text>
    <rect x="368" y="195" width="100" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="418" y="225" text-anchor="middle" class="value" style="fill:#191919">1</text>
    <rect x="468" y="195" width="100" height="42" fill="#D6D6D6" stroke="#191919" stroke-width="2.4"/>
  <text x="518" y="225" text-anchor="middle" class="value" style="fill:#191919">1</text>
  </g>
  <text x="144" y="225" text-anchor="end">mask</text>
