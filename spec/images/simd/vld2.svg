<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">vld2：连续加载后按奇偶位置拆分</title>
  <desc id="desc">从 src 下标加 off 的最终起点连续读取 2N 个元素。绿色为偶数位置，蓝色为奇数位置；even 取位置 0、2、4 等，odd 取位置 1、3、5 等。图中 N=8 只说明排列，16 位数据实际 N=128，32 位数据实际 N=64。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #191919; font-size: 26px; }
    .value { fill: #FFFFFF; }
    .note { font-size: 20px; }
    .index { font-size: 18px; }
    .caption { font-size: 25px; }
  </style>
  <rect width="1280" height="480" fill="#FFFFFF"/>
  <text x="688" y="27" text-anchor="middle" class="note">起点 = src 的下标 + off（元素偏移）</text>
  <g id="ub">
    <rect x="256" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="283" y="88" text-anchor="middle" class="value">0</text>
    <rect x="310" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="337" y="88" text-anchor="middle" class="value">1</text>
    <rect x="364" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="391" y="88" text-anchor="middle" class="value">2</text>
    <rect x="418" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="445" y="88" text-anchor="middle" class="value">3</text>
    <rect x="472" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="499" y="88" text-anchor="middle" class="value">4</text>
    <rect x="526" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="553" y="88" text-anchor="middle" class="value">5</text>
    <rect x="580" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="607" y="88" text-anchor="middle" class="value">6</text>
    <rect x="634" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="661" y="88" text-anchor="middle" class="value">7</text>
    <rect x="688" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="715" y="88" text-anchor="middle" class="value">8</text>
    <rect x="742" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="769" y="88" text-anchor="middle" class="value">9</text>
    <rect x="796" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="823" y="88" text-anchor="middle" class="value">10</text>
    <rect x="850" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="877" y="88" text-anchor="middle" class="value">11</text>
    <rect x="904" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="931" y="88" text-anchor="middle" class="value">12</text>
    <rect x="958" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="985" y="88" text-anchor="middle" class="value">13</text>
    <rect x="1012" y="48" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="1039" y="88" text-anchor="middle" class="value">14</text>
    <rect x="1066" y="48" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="1093" y="88" text-anchor="middle" class="value">15</text>
  </g>
  <text x="232" y="88" text-anchor="end">UB</text>
  <polygon points="660,144 678,144 678,171 686.5,171 669,199 651.5,171 660,171" fill="#582877" stroke="#191919" stroke-width="2.4"/>
  <g id="even">
    <rect x="148" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="175" y="270" text-anchor="middle" class="value">0</text>
    <rect x="202" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="229" y="270" text-anchor="middle" class="value">2</text>
    <rect x="256" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="283" y="270" text-anchor="middle" class="value">4</text>
    <rect x="310" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="337" y="270" text-anchor="middle" class="value">6</text>
    <rect x="364" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="391" y="270" text-anchor="middle" class="value">8</text>
    <rect x="418" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="445" y="270" text-anchor="middle" class="value">10</text>
    <rect x="472" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="499" y="270" text-anchor="middle" class="value">12</text>
    <rect x="526" y="230" width="54" height="62" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
  <text x="553" y="270" text-anchor="middle" class="value">14</text>
  </g>
  <text x="124" y="270" text-anchor="end">even</text>
  <path d="M 148 293 Q 148 315 157 315 H 571 Q 580 315 580 293 M 364 315 V 333" fill="none" stroke="#191919" stroke-width="2.4"/>
  <text x="364" y="366" text-anchor="middle">even positions</text>
  <g id="odd">
    <rect x="788" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="815" y="270" text-anchor="middle" class="value">1</text>
    <rect x="842" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="869" y="270" text-anchor="middle" class="value">3</text>
    <rect x="896" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="923" y="270" text-anchor="middle" class="value">5</text>
    <rect x="950" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="977" y="270" text-anchor="middle" class="value">7</text>
    <rect x="1004" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="1031" y="270" text-anchor="middle" class="value">9</text>
    <rect x="1058" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="1085" y="270" text-anchor="middle" class="value">11</text>
    <rect x="1112" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="1139" y="270" text-anchor="middle" class="value">13</text>
    <rect x="1166" y="230" width="54" height="62" fill="#146889" stroke="#191919" stroke-width="2.4"/>
  <text x="1193" y="270" text-anchor="middle" class="value">15</text>
  </g>
  <text x="764" y="270" text-anchor="end">odd</text>
  <path d="M 788 293 Q 788 315 797 315 H 1211 Q 1220 315 1220 293 M 1004 315 V 333" fill="none" stroke="#191919" stroke-width="2.4"/>
  <text x="1004" y="366" text-anchor="middle">odd positions</text>
  <text x="640" y="427" text-anchor="middle" class="caption">vld2：连续读取 2N 个元素，返回两个 N 元素向量</text>
  <text x="640" y="460" text-anchor="middle" class="note">数字为相对起点的位置；实际 N：16 位为 128，32 位为 64。</text>
</svg>
