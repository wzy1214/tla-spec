  <text x="193" y="488" text-anchor="middle" class="value" style="fill:#191919">—</text>
  <text x="193" y="438" text-anchor="middle" class="index">0</text>
    <rect x="218" y="449" width="50" height="60" fill="#4B8B1B" stroke="#191919" stroke-width="2.4"/>
