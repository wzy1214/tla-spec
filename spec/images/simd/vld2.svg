<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">vld2 · 连续加载并去交错</title>
  <desc id="desc">从 src 加 off 的元素位置开始读取连续数据 x0 至 x7。even 返回 x0、x2、x4、x6，odd 返回 x1、x3、x5、x7；图中 N=4 仅用于说明排列。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8292A4"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #183047; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #536478; }
    .label { font-size: 19px; font-weight: 600; }
    .small { font-size: 17px; fill: #536478; }
    .index { font-size: 15px; fill: #697889; }
    .cell { font-size: 21px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="579" rx="12" fill="#FFFFFF" stroke="#D5DFE9"/>
  <text x="32" y="49" class="title">vld2 · 连续加载并去交错</text>
  <text x="928" y="46" class="small" text-anchor="end">TLA / SIMD</text>
  <text x="32" y="81" class="subtitle">从最终起点连续读取 2N 个元素，分别输出偶数和奇数位置。</text>
  <line x1="32" y1="103" x2="928" y2="103" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="32" y="142" class="label">最终起点 = src 的下标 + off（单位：元素）</text>
  <text x="32" y="177" class="small">连续 UB 数据</text>
  <rect x="80" y="220" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="126.0" y="252.0" class="cell" text-anchor="middle" style="fill:#214E94">x0</text>
  <text x="126.0" y="210" class="index" text-anchor="middle">0</text>
  <rect x="181" y="220" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="227.0" y="252.0" class="cell" text-anchor="middle" style="fill:#146350">x1</text>
  <text x="227.0" y="210" class="index" text-anchor="middle">1</text>
  <rect x="282" y="220" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="328.0" y="252.0" class="cell" text-anchor="middle" style="fill:#214E94">x2</text>
  <text x="328.0" y="210" class="index" text-anchor="middle">2</text>
  <rect x="383" y="220" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="429.0" y="252.0" class="cell" text-anchor="middle" style="fill:#146350">x3</text>
  <text x="429.0" y="210" class="index" text-anchor="middle">3</text>
  <rect x="484" y="220" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="530.0" y="252.0" class="cell" text-anchor="middle" style="fill:#214E94">x4</text>
  <text x="530.0" y="210" class="index" text-anchor="middle">4</text>
  <rect x="585" y="220" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="631.0" y="252.0" class="cell" text-anchor="middle" style="fill:#146350">x5</text>
  <text x="631.0" y="210" class="index" text-anchor="middle">5</text>
  <rect x="686" y="220" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="732.0" y="252.0" class="cell" text-anchor="middle" style="fill:#214E94">x6</text>
  <text x="732.0" y="210" class="index" text-anchor="middle">6</text>
  <rect x="787" y="220" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="833.0" y="252.0" class="cell" text-anchor="middle" style="fill:#146350">x7</text>
  <text x="833.0" y="210" class="index" text-anchor="middle">7</text>
  <path d="M 277 272 V 309 H 248 V 337" fill="none" stroke="#8292A4" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 681 272 V 309 H 712 V 337" fill="none" stroke="#8292A4" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="32" y="345" width="432" height="121" rx="8" fill="#F8FAFC" stroke="#D5DFE9"/>
  <text x="52" y="376" class="label">even</text>
  <text x="444" y="376" class="small" text-anchor="end">取第 2i 个元素</text>
  <rect x="52" y="394" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="98.0" y="426.0" class="cell" text-anchor="middle" style="fill:#214E94">x0</text>
  <rect x="152" y="394" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="198.0" y="426.0" class="cell" text-anchor="middle" style="fill:#214E94">x2</text>
  <rect x="252" y="394" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="298.0" y="426.0" class="cell" text-anchor="middle" style="fill:#214E94">x4</text>
  <rect x="352" y="394" width="92" height="50" rx="6" fill="#EAF1FF" stroke="#3068BC"/>
  <text x="398.0" y="426.0" class="cell" text-anchor="middle" style="fill:#214E94">x6</text>
  <rect x="496" y="345" width="432" height="121" rx="8" fill="#F8FAFC" stroke="#D5DFE9"/>
  <text x="516" y="376" class="label">odd</text>
  <text x="908" y="376" class="small" text-anchor="end">取第 2i+1 个元素</text>
  <rect x="516" y="394" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="562.0" y="426.0" class="cell" text-anchor="middle" style="fill:#146350">x1</text>
  <rect x="616" y="394" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="662.0" y="426.0" class="cell" text-anchor="middle" style="fill:#146350">x3</text>
  <rect x="716" y="394" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="762.0" y="426.0" class="cell" text-anchor="middle" style="fill:#146350">x5</text>
  <rect x="816" y="394" width="92" height="50" rx="6" fill="#E4F4EE" stroke="#19826B"/>
  <text x="862.0" y="426.0" class="cell" text-anchor="middle" style="fill:#146350">x7</text>
  <line x1="32" y1="487" x2="928" y2="487" stroke="#D5DFE9" stroke-width="1.5"/>
  <text x="32" y="512" class="small">图中 N = 4 仅作排列示意。实际 N：16 位数据为 128，32 位数据为 64。</text>
  <text x="32" y="537" class="small">起点后须容纳两个完整向量；本接口不接收 mask，也不更新地址。</text>
</svg>
